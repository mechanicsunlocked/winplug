<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Winplug</title>
  <!-- Windows: four panes -->
  <g fill="#0078D4">
    <rect x="8"  y="8"  width="52" height="52" rx="6"/>
    <rect x="68" y="8"  width="52" height="52" rx="6"/>
    <rect x="8"  y="68" width="52" height="52" rx="6"/>
    <rect x="68" y="68" width="52" height="52" rx="6"/>
  </g>
  <!-- USB trident in the bottom-right pane, white on blue -->
  <g transform="translate(72.7 72.5) scale(0.43)">
    <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 22 V80"/>
      <path d="M50 66 L24 50 V40"/>
      <path d="M50 54 L76 38 V30"/>
    </g>
    <g fill="#ffffff">
      <path d="M50 3 L63 25 H37 Z"/>
      <circle cx="50" cy="86" r="11"/>
      <circle cx="24" cy="33" r="9"/>
      <rect x="68" y="15" width="16" height="16"/>
    </g>
  </g>
</svg>
