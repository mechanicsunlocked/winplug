<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Winplug</title>
  <!-- Windows: four panes -->
  <g fill="#0078D4">
    <rect x="8"  y="8"  width="52" height="52" rx="6"/>
    <rect x="68" y="8"  width="52" height="52" rx="6"/>
    <rect x="8"  y="68" width="52" height="52" rx="6"/>
    <rect x="68" y="68" width="52" height="52" rx="6"/>
  </g>
  <!-- USB trident, with a dark outline so it reads on the blue -->
  <g fill="none" stroke="#0b1f33" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M64 116 V30"/>
    <path d="M64 84 L36 66 V52"/>
    <path d="M64 72 L92 56 V48"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 116 V30"/>
    <path d="M64 84 L36 66 V52"/>
    <path d="M64 72 L92 56 V48"/>
  </g>
  <g fill="#ffffff" stroke="#0b1f33" stroke-width="3" opacity="0.98">
    <!-- arrow head -->
    <path d="M64 8 L78 34 H50 Z"/>
    <!-- square end -->
    <rect x="27" y="36" width="18" height="18"/>
    <!-- circle end -->
    <circle cx="92" cy="38" r="10"/>
    <!-- plug end -->
    <rect x="50" y="104" width="28" height="16" rx="3"/>
  </g>
</svg>
